name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is the development and serving platform and stays a hard gate. The
    # Linux leg is advisory: `npm run verify` has a known ubuntu-only failure
    # (diagnostic tooling assumptions in the watchdog e2e test), so its result
    # is reported in the Actions tab but does not fail the run or email on every
    # push. Drop this once the Linux leg is genuinely green.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  compatibility:
    name: Pi ${{ matrix.pi }} isolated consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.80", "0.81", "0.82", "0.83", "0.84"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node harness/scripts/compat-consumer.mjs ${{ matrix.pi }}

  peer-boundaries:
    name: Peer dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node harness/scripts/peer-boundary-smoke.mjs
