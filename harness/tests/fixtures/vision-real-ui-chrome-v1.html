<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision real UI fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 640px; height: 360px; margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    header { height: 48px; padding: 14px 24px; background: #172033; color: #ffffff; font-size: 16px; font-weight: 700; }
    main { position: relative; width: 640px; height: 312px; background: #eef2f7; }
    section { position: absolute; left: 120px; top: 40px; width: 400px; height: 184px; padding: 24px; border-radius: 12px; background: #ffffff; box-shadow: 0 2px 8px rgb(15 23 42 / 12%); }
    h1 { margin: 0 0 10px; color: #172033; font-size: 20px; }
    p { margin: 0; color: #475569; font-size: 14px; line-height: 20px; }
    button { position: absolute; left: 240px; top: 126px; width: 120px; height: 40px; border: 0; border-radius: 6px; background: #16a34a; color: #ffffff; font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <header>Account settings</header>
  <main>
    <section aria-label="Confirmation dialog">
      <h1>Save profile changes?</h1>
      <p>Your updated notification preferences will take effect immediately.</p>
      <button id="confirm" aria-label="Confirm changes">Confirm</button>
    </section>
  </main>
</body>
<script>
  window.addEventListener("load", () => {
    const box = document.querySelector("#confirm").getBoundingClientRect();
    document.documentElement.dataset.confirmBox = [box.x, box.y, box.width, box.height].map(Math.round).join(",");
  });
</script>
</html>
